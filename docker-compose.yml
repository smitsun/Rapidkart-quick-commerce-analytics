services:
  postgres:
    image: postgres:16-alpine
    container_name: quickcommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst}
      POSTGRES_DB: ${POSTGRES_DB:-quickcommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quickcommerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-quickcommerce}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  quickcommerce_pgdata:

